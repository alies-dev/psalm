name: Perf comment

# Posts the sticky perf report on the pull request. Runs from the default branch with a write token, therefore it
# never checks out or executes anything from the pull request: the `perf-report` artifact produced by the
# unprivileged Perf workflow is treated as untrusted data (validated, passed via files and env, never interpolated
# into shell).

on:
  workflow_run:
    workflows: [Perf]
    types: [completed]

permissions:
  pull-requests: write # create/update the sticky comment
  actions: read # download the artifact of the triggering run

concurrency:
  group: perf-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  comment:
    name: Upsert PR comment
    # "failure" is the normal outcome when the gate fails; the report must still be posted.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate report and pull request
        id: validate
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          dir="$RUNNER_TEMP/perf-report"
          skip() { echo "::notice title=Perf comment::$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          [ -f "$dir/report.md" ] || skip "No report.md in the artifact (the Perf run failed before comparing)."

          # Untrusted values: accept only exact shapes before using them anywhere.
          pr_number=$(head -c 20 "$dir/pr_number" 2>/dev/null || true)
          report_sha=$(head -c 64 "$dir/head_sha" 2>/dev/null || true)
          [[ "$pr_number" =~ ^[0-9]{1,9}$ ]] || skip "Artifact has no valid pr_number."
          [[ "$report_sha" =~ ^[0-9a-f]{40}$ ]] || skip "Artifact has no valid head_sha."
          [ "$report_sha" = "$RUN_HEAD_SHA" ] || skip "Artifact head_sha does not match the triggering run."

          # The PR must still point at the measured commit (a newer push has its own run and comment).
          pr_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
          [ "$pr_head" = "$RUN_HEAD_SHA" ] || skip "PR #${pr_number} moved on to ${pr_head}, ignoring stale report."

          # Marker is added here, not taken from the artifact. GitHub limits comments to 65536 characters.
          {
            echo '<!-- psalm-perf-report -->'
            head -c 60000 "$dir/report.md" | iconv -f UTF-8 -t UTF-8 -c
          } > "$RUNNER_TEMP/comment.md"
          if [ "$(wc -c < "$dir/report.md")" -gt 60000 ]; then
            printf '\n\n_Report truncated, see the workflow run for the full summary._\n' >> "$RUNNER_TEMP/comment.md"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Upsert sticky comment
        if: steps.validate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        run: |
          comment_id=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- psalm-perf-report -->"))) | .id' \
              | sed -n '1p'
          )
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$RUNNER_TEMP/comment.md" --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" --silent
          fi
