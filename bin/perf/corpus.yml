# Measured by .github/workflows/perf.yml via bin/perf/run-shard.sh; converted with `yq -o=json` (mikefarah v4).
# Top level: php (runner version), memory_limit (Psalm --memory-limit), install_timeout (s per project install),
#   php_ini (-d settings),
#   jobs (job id -> projects, each project in one job), projects (name -> fields below).
# Project: repo (https URL), ref (commit SHA, never a branch), tag (release of ref), timeout (s per run),
#   exercises (shown in the report), composer (false skips the install), before_install / after_install (shell),
#   psalm.dirs / ignore / attributes / extensions (generate psalm-perf.xml; attributes override the fixed ones,
#   errorLevel defaults to 1).

php: "8.6"
install_timeout: 180
memory_limit: 12G
php_ini:
  opcache.enable: "1"
  opcache.enable_cli: "1"
  opcache.jit: "0"
  opcache.validate_timestamps: "0"
  opcache.file_update_protection: "0"
  opcache.max_accelerated_files: "1000000"
  opcache.interned_strings_buffer: "64"
  opcache.memory_consumption: "512"
  opcache.optimization_level: "0x7FFEBFFF"
  opcache.save_comments: "1"

jobs:
  small: [amphp-amp, webmozarts-assert, guzzle-promises, monolog]
  wordpress: [wordpress]

projects:
  wordpress:
    repo: https://github.com/WordPress/wordpress-develop
    ref: "97382397b2bd7c85aef6d4cd1c10bafd397957fc"
    tag: 6.8.3
    timeout: 400
    # Its require-dev holds only coding-standard tools; Psalm needs no more than an autoloader.
    composer: false
    before_install: composer dump-autoload --no-scripts --no-interaction
    exercises: legacy procedural code without types (about 1600 files), long boolean and string-matching conditions, HTML built by concatenation, superglobals, large taint graph
    psalm:
      dirs: [src]

  amphp-amp:
    repo: https://github.com/amphp/amp
    ref: "73c38b323ff8d790abf0f76c56fcc892bda4111a"
    tag: v3.1.3
    timeout: 60
    exercises: fibers, generics (Future<T>), closures templates, small and fast
    psalm:
      dirs: [src]
      attributes: {phpVersion: "8.1"}

  webmozarts-assert:
    repo: https://github.com/webmozarts/assert
    ref: "8a163706bbcac613733dba03f51e13b5eb1bb819"
    tag: 2.5.0
    timeout: 90
    exercises: psalm-assert type narrowing, pure/immutable annotations, static-analysis fixture files
    psalm:
      dirs: [src, tests/static-analysis]
      attributes: {phpVersion: "8.2"}

  guzzle-promises:
    repo: https://github.com/guzzle/promises
    ref: "094d0ec418eb3b1411ea271a180ec95cae6ae933"
    tag: 3.1.0
    timeout: 60
    exercises: template defaults (@template T = mixed), conditional return types over templates and nullable callables, PromiseInterface<TValue, TReason> generics through then/otherwise chains, small and fast
    psalm:
      dirs: [src]
      attributes: {phpVersion: "7.4"}

  monolog:
    repo: https://github.com/Seldaek/monolog
    ref: "d7059e4c691d05ea1222b5124bed0f961be46e15"
    tag: 3.12.1
    timeout: 60
    exercises: Psalm's bundled Monolog library stub (taints and capabilities) on the library's own subclasses, handler and formatter hierarchies, PSR-3 logger implementation, small and fast
    psalm:
      dirs: [src]
      attributes: {phpVersion: "8.1"}
