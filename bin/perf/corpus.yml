# Corpus of real projects measured by the perf CI (.github/workflows/perf.yml) and by bin/perf/run-shard.sh.
# Shared, committed source of truth. See bin/perf/README.md.
#
# Every project is pinned to an IMMUTABLE commit, so the install is reproducible. The harness generates each
# project's Psalm config (psalm-perf.xml) from the fields below; nothing else is read from the project.
#
# Read with mikefarah yq v4 (preinstalled on ubuntu-latest, `brew install yq` locally): the workflow converts this
# file once with `yq -o=json bin/perf/corpus.yml`, PHP never parses YAML.
#
# Top level:
#   php           PHP version of the runner (install and analysis)
#   memory_limit  Psalm --memory-limit; also the denominator of the "memory crash" verdict
#   php_ini       php.ini settings passed to every Psalm run with -d
#   jobs          CI job id -> list of projects measured sequentially by that job; every project in exactly one job
#   projects      project name (also its directory name) -> fields below
#
# Project fields:
#   repo            public https clone URL
#   ref             immutable commit SHA (never a moving branch), tag in a comment
#   tag             the release tag of ref; also feeds COMPOSER_ROOT_VERSION for `self.version` requirements
#   timeout         seconds per Psalm run, about twice the single-threaded analysis time on a GitHub runner
#   exercises       what the project stresses in Psalm (shown in the report)
#   psalm           what the generated psalm-perf.xml holds:
#     dirs            projectFiles directories; globs allowed
#     ignore          optional extra ignoreFiles directories (`vendor` is always ignored); globs allowed
#     attributes      optional map of extra root <psalm> attributes (phpVersion, ensureOverrideAttribute, ...); also
#                     overrides the fixed ones, e.g. errorLevel. errorLevel defaults to 1: the level only changes
#                     error/info labels, not what is analysed or reported, and level 1 keeps severities uniform so a
#                     reclassified issue type does not flip thousands of issues
#     extensions      optional list of file extensions, written as <fileExtensions><extension name=".x"/>
#   composer        optional; false skips `composer update`
#
# Escape hatch for what the fields above cannot express (prefer them; no project needs a hook today):
#   before_install  optional shell, run in the project dir before `composer update` (install quirks)
#   after_install   optional shell, run once in the project dir after `composer update` and after psalm-perf.xml is
#                   generated, before the base and head runs; may patch psalm-perf.xml
#
# Fixed: findUnusedCode, findUnusedBaselineEntry and findUnusedIssueHandlerSuppression are false (overridable through
# attributes); loadLibraryPlugins is false whenever both Psalm checkouts support it.

php: "8.5"
memory_limit: 12G
php_ini:
  opcache.enable: "1"
  opcache.enable_cli: "1"
  opcache.jit: "0"
  opcache.validate_timestamps: "0"
  opcache.file_update_protection: "0"
  opcache.max_accelerated_files: "1000000"
  opcache.interned_strings_buffer: "64"
  opcache.memory_consumption: "512"
  opcache.optimization_level: "0x7FFEBFFF"
  opcache.save_comments: "1"

jobs:
  laravel: [laravel]
  symfony: [symfony]
  orm-psl: [doctrine-orm, psl]
  phpunit-parser: [phpunit, php-parser]
  small: [amphp-amp, webmozarts-assert]
  drupal: [drupal]

projects:
  laravel:
    repo: https://github.com/laravel/framework
    ref: "d52c3b3129e4c8e213c97cdc68f94b0b7d27f181" # v13.39.0
    tag: v13.39.0
    timeout: 300
    exercises: magic __call/macros, Eloquent generics and template inference, large Collection/Support type surface, facades, container resolution
    psalm:
      dirs: [src]

  symfony:
    repo: https://github.com/symfony/symfony
    ref: "34a08ab1b25dac1ebbdca78927f27cf353993625" # v8.1.10
    tag: v8.1.10
    timeout: 400
    exercises: very wide codebase (about 4400 files), PHP 8.4+ features (property hooks, asymmetric visibility), many small independent components, polyfills, heavy interface graphs
    psalm:
      dirs: [src]
      ignore:
        - src/Symfony/*/*/Tests
        - src/Symfony/*/*/*/Tests
        - src/Symfony/*/*/*/*/Tests
        - src/Symfony/Component/Intl/Resources/data
        - src/Symfony/Component/Emoji/Resources/data
        - src/Symfony/*/*/Resources/views
        - src/Symfony/*/*/*/Resources/views
      attributes: {ensureOverrideAttribute: "false"}

  drupal:
    repo: https://github.com/drupal/drupal
    ref: "76deda03b09b57d76941e2d30e6dade35e92a14a" # 11.4.11
    tag: 11.4.11
    timeout: 600
    exercises: custom file extensions (.module/.inc/.install), procedural hooks plus OOP services, plugin/annotation/attribute discovery, dynamic entity APIs, large taint graph
    psalm:
      dirs: [core/lib, core/modules]
      ignore:
        - core/modules/*/tests
        - core/modules/*/src/Tests
        - core/lib/Drupal/Component/*/Tests
      extensions: [.php, .module, .inc, .install, .theme, .profile, .engine]

  doctrine-orm:
    repo: https://github.com/doctrine/orm
    ref: "4487f850401c0e1f27891cce5897fa90b3055c2a" # 3.7.6
    tag: 3.7.6
    timeout: 120
    exercises: deep class hierarchies, class-string<T> repositories, attributes metadata
    psalm:
      dirs: [src]

  psl:
    repo: https://github.com/php-standard-library/php-standard-library
    ref: "f537759b58ba36c8093505004e1bff7578238736" # 6.4.2
    tag: 6.4.2
    timeout: 120
    exercises: heavily templated functional library, 70+ packages, generics, conditional types, assertions
    psalm:
      dirs: [packages/*/src]
      attributes: {phpVersion: "8.4"}

  phpunit:
    repo: https://github.com/sebastianbergmann/phpunit
    ref: "941457a4f147a60fe2074d40e1fce0d08ea8d930" # 13.4.5
    tag: 13.4.5
    timeout: 120
    exercises: large final-class codebase, readonly/immutable value objects, modern PHP 8.4 syntax, event system
    psalm:
      dirs: [src]
      attributes: {phpVersion: "8.4"}

  php-parser:
    repo: https://github.com/nikic/PHP-Parser
    ref: "9e33da9553fe7786f0962b35f4e4ecf01be89def" # v5.9.0
    tag: v5.9.0
    timeout: 120
    exercises: large AST node class hierarchy, many untyped closures and arrays, visitor pattern
    psalm:
      dirs: [lib]
      attributes: {phpVersion: "7.4"}

  amphp-amp:
    repo: https://github.com/amphp/amp
    ref: "73c38b323ff8d790abf0f76c56fcc892bda4111a" # v3.1.3
    tag: v3.1.3
    timeout: 60
    exercises: fibers, generics (Future<T>), closures templates, small and fast
    psalm:
      dirs: [src]
      attributes: {phpVersion: "8.1"}

  webmozarts-assert:
    repo: https://github.com/webmozarts/assert
    ref: "8a163706bbcac613733dba03f51e13b5eb1bb819" # 2.5.0
    tag: 2.5.0
    timeout: 90
    exercises: psalm-assert type narrowing, pure/immutable annotations, static-analysis fixture files
    psalm:
      dirs: [src, tests/static-analysis]
      attributes: {phpVersion: "8.2"}
